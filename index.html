<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Simple Store</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- LOGIN PAGE -->
  <section id="loginPage" class="login-page">
    <form id="loginForm" class="login-card">
      <h1>Simple Store</h1>
      <p class="muted">Log in to continue</p>

      <label>Username
        <input name="username" placeholder="user123" required />
      </label>

      <label>Password
        <input name="password" type="password" placeholder="password" required />
      </label>

      <button class="btn primary full">Log in</button>
      <p id="loginError" class="error"></p>
    </form>
  </section>

  <!-- MAIN APP -->
  <div id="app" class="hidden">
    <header class="header">
      <div class="container header-inner">
        <h1 class="logo">Simple Store</h1>

        <input id="search" type="search" placeholder="Search products..." />

        <select id="sortSelect">
          <option value="suggested">Suggested</option>
          <option value="price-asc">Price: Low to High</option>
          <option value="price-desc">Price: High to Low</option>
          <option value="title-asc">Name: A–Z</option>
          <option value="rating-desc">Top rated</option>
        </select>

        <button id="cartBtn" class="cart-button">
          Cart <span id="cartCount">0</span>
        </button>

        <button id="logoutBtn" class="ghost-button">Log out</button>
      </div>
    </header>

    <main class="container">
      <div class="page-head">
        <div>
          <h2 id="sectionTitle">Suggested products</h2>
          <p id="status" class="muted">Loading products...</p>
        </div>
      </div>

      <section id="grid" class="grid"></section>

      <div class="pagination">
        <button id="prevBtn" class="ghost-button">Previous</button>
        <span id="pageInfo"></span>
        <button id="nextBtn" class="ghost-button">Next</button>
      </div>
    </main>
  </div>

  <!-- CART -->
  <div id="cartOverlay" class="overlay"></div>

  <aside id="cartDrawer" class="cart-drawer">
    <div class="cart-header">
      <h2>Your cart</h2>
      <button id="closeCartBtn" class="close-button">×</button>
    </div>

    <div id="cartItems" class="cart-items"></div>

    <div class="cart-footer">
      <div class="total-row">
        <span>Total</span>
        <strong id="cartTotal">$0.00</strong>
      </div>

      <button id="checkoutBtn" class="btn primary full">Checkout</button>
    </div>
  </aside>

  <div id="toast" class="toast"></div>

  <script src="app.js"></script>
</body>
</html>
