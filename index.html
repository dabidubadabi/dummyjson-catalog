<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Product Catalog</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <h1>🛍️ Product Catalog</h1>

    <input id="search" type="search" placeholder="Search products..." />

    <select id="sortSelect">
      <option value="">Sort by</option>
      <option value="price-asc">Price: Low to High</option>
      <option value="price-desc">Price: High to Low</option>
      <option value="title-asc">Name: A to Z</option>
      <option value="title-desc">Name: Z to A</option>
      <option value="rating-desc">Top Rated</option>
    </select>

    <button id="cartBtn">🛒 Cart (<span id="cartCount">0</span>)</button>
    <button id="loginBtn">Log in</button>
  </header>

  <main>
    <p id="status">Loading products...</p>
    <section id="grid" class="grid"></section>

    <div class="pager">
      <button id="prevBtn">Previous</button>
      <span id="pageInfo"></span>
      <button id="nextBtn">Next</button>
    </div>
  </main>

  <!-- Login -->
  <dialog id="loginDialog">
    <form id="loginForm">
      <h2>Log in</h2>
      <p class="hint">
        Demo account:<br />
        Username: <strong>emilys</strong><br />
        Password: <strong>emilyspass</strong>
      </p>

      <label>
        Username
        <input name="username" required />
      </label>

      <label>
        Password
        <input name="password" type="password" required />
      </label>

      <menu>
        <button type="button" id="loginCancelBtn">Cancel</button>
        <button type="submit">Log in</button>
      </menu>
    </form>
  </dialog>

  <!-- Add / Edit product -->
  <dialog id="productDialog">
    <form id="productForm">
      <h2 id="dialogTitle">Add Product</h2>

      <label>
        Title
        <input name="title" required />
      </label>

      <label>
        Description
        <textarea name="description" rows="3"></textarea>
      </label>

      <div class="row">
        <label>
          Price
          <input name="price" type="number" step="0.01" min="0" required />
        </label>

        <label>
          Stock
          <input name="stock" type="number" min="0" required />
        </label>
      </div>

      <label>
        Image URL
        <input name="thumbnail" type="url" placeholder="https://..." />
      </label>

      <menu>
        <button type="button" id="cancelBtn">Cancel</button>
        <button type="submit">Save</button>
      </menu>
    </form>
  </dialog>

  <!-- Cart -->
  <dialog id="cartDialog">
    <div class="cart-box">
      <h2>Your Cart</h2>

      <div id="cartItems"></div>

      <div class="cart-total">
        <span>Total</span>
        <strong id="cartTotal">$0.00</strong>
      </div>

      <menu>
        <button type="button" id="closeCartBtn">Close</button>
        <button type="button" id="checkoutBtn" class="primary">
          Purchase
        </button>
      </menu>
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
